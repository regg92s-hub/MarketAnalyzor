name: CI (syntetisk full-bygg-test)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pandas numpy requests yfinance
      - name: Compileall (fanger avkuttede filer)
        run: python -m compileall -q scripts tests
      - name: Syntetisk full-bygg-test
        run: python tests/test_build_synthetic.py
